<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Watch List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Movie Watch List</h1>
    </header>
    <div class="appContainer">
      <input id="movieInput" type="text" placeholder="Enter Movie" />
      <button id="enterBtn">Enter Moive</button>
      <button id="clearBtn">Clear</button>
      <ul id="movieList"></ul>
      <div class="watchedMoviesContainer">
        <header>
          <h2>Watched Movies</h2>
        </header>
      <ul id="watchedMoviesList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
